<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Orden de Servicio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:white;border-radius:16px;padding:32px;max-width:680px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08)}.header{text-align:center;margin-bottom:28px}.header h1{font-size:24px;color:#1a202c;margin-bottom:4px}.header p{color:#718096;font-size:14px}.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4a5568;margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid.full{grid-template-columns:1fr}label{display:block;font-size:13px;font-weight:600;color:#4a5568;margin-bottom:5px}input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;color:#2d3748;background:#f7fafc}input:focus,select:focus,textarea:focus{outline:none;border-color:#667eea;background:white}textarea{resize:vertical;min-height:80px}.btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-size:16px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:28px}.btn:disabled{opacity:.6;cursor:not-allowed}.alert{display:none;padding:14px 16px;border-radius:10px;margin-top:16px;font-size:14px;font-weight:500}.alert.success{background:#f0fff4;color:#276749;border:1px solid #9ae6b4;display:block}.alert.error{background:#fff5f5;color:#c53030;border:1px solid #feb2b2;display:block}.numero-orden{background:linear-gradient(135deg,#667eea,#764ba2);color:white;text-align:center;border-radius:10px;padding:12px;margin-bottom:8px;font-size:22px;font-weight:800;letter-spacing:2px;display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><div class="card"><div class="header"><h1>Orden de Servicio</h1><p>Completa el formulario para registrar tu equipo</p></div><div class="numero-orden" id="numeroOrden"></div><div class="alert" id="alerta"></div><form id="formOrden"><div class="section-title">Datos del Cliente</div><div class="grid"><div><label>Nombre completo *</label><input type="text" id="nombre" placeholder="Juan Garcia" required/></div><div><label>Telefono</label><input type="tel" id="telefono" placeholder="555-123-4567"/></div><div><label>Email</label><input type="email" id="email" placeholder="juan@email.com"/></div><div><label>Direccion</label><input type="text" id="direccion" placeholder="Calle, Colonia, Ciudad"/></div></div><div class="section-title">Datos del Equipo / Vehiculo</div><div class="grid"><div><label>Marca *</label><input type="text" id="marca" placeholder="Toyota, Samsung..." required/></div><div><label>Modelo</label><input type="text" id="modelo" placeholder="Corolla, Galaxy S21"/></div><div><label>Numero de serie</label><input type="text" id="serie" placeholder="SN-XXXXXXXX"/></div><div><label>Anio</label><input type="number" id="anio" placeholder="2023" min="1900" max="2100"/></div></div><div class="section-title">Descripcion del Servicio</div><div class="grid full"><div><label>Tipo de servicio</label><select id="tipo_servicio"><option value="">Selecciona</option><option value="mantenimiento_preventivo">Mantenimiento preventivo</option><option value="mantenimiento_correctivo">Mantenimiento correctivo</option><option value="diagnostico">Diagnostico</option><option value="reparacion">Reparacion</option><option value="instalacion">Instalacion</option><option value="revision_general">Revision general</option><option value="otro">Otro</option></select></div><div><label>Problema reportado</label><textarea id="problema" placeholder="Describe el problema..."></textarea></div></div><div class="section-title">Seguimiento</div><div class="grid"><div><label>Tecnico asignado</label><input type="text" id="tecnico" placeholder="Nombre del tecnico"/></div><div><label>Fecha de entrega estimada</label><input type="date" id="fecha_entrega"/></div><div style="grid-column:1/-1"><label>Observaciones</label><textarea id="observaciones" placeholder="Accesorios, condiciones especiales..."></textarea></div></div><button type="submit" class="btn" id="btnEnviar">Registrar Orden de Servicio</button></form></div><script>const SUPABASE_URL='https://aslnukmynjhmtelijgmg.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzbG51a215bmpobXRlbGlqZ21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDg2OTYsImV4cCI6MjA5NTQ4NDY5Nn0.ncjW3E6ckfXlaetG7BJL5V4JpTZxy3UaIcu9uDMV5yw';const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);document.getElementById('formOrden').addEventListener('submit',async(e)=>{e.preventDefault();const btn=document.getElementById('btnEnviar');const alerta=document.getElementById('alerta');const numOrden=document.getElementById('numeroOrden');alerta.className='alert';alerta.textContent='';numOrden.style.display='none';btn.disabled=true;btn.textContent='Guardando...';try{const{data:cliente,error:errCliente}=await supabase.from('clientes').insert({nombre:document.getElementById('nombre').value.trim(),telefono:document.getElementById('telefono').value.trim()||null,email:document.getElementById('email').value.trim()||null,direccion:document.getElementById('direccion').value.trim()||null}).select().single();if(errCliente)throw errCliente;const{data:equipo,error:errEquipo}=await supabase.from('equipos').insert({cliente_id:cliente.id,marca:document.getElementById('marca').value.trim(),modelo:document.getElementById('modelo').value.trim()||null,serie:document.getElementById('serie').value.trim()||null,anio:document.getElementById('anio').value?parseInt(document.getElementById('anio').value):null}).select().single();if(errEquipo)throw errEquipo;const{data:orden,error:errOrden}=await supabase.from('ordenes_servicio').insert({cliente_id:cliente.id,equipo_id:equipo.id,tipo_servicio:document.getElementById('tipo_servicio').value||null,problema_reportado:document.getElementById('problema').value.trim()||null,tecnico_asignado:document.getElementById('tecnico').value.trim()||null,fecha_entrega_estimada:document.getElementById('fecha_entrega').value||null,observaciones:document.getElementById('observaciones').value.trim()||null,estado:'recibido'}).select().single();if(errOrden)throw errOrden;numOrden.textContent='Orden #'+orden.numero_orden+' registrada';numOrden.style.display='block';alerta.className='alert success';alerta.textContent='Orden creada para '+cliente.nombre+'. Gracias!';e.target.reset();}catch(err){console.error(err);alerta.className='alert error';alerta.textContent='Error: '+(err.message||'Intenta de nuevo.');}finally{btn.disabled=false;btn.textContent='Registrar Orden de Servicio';}});</script></body></html>
